<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-box {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background-color: #007BFF;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message.other {
            background-color: #e9ecef;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            font-size: 14px;
            color: #6c757d;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: #f8f9fa;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: #007BFF;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="chat-box">
        <div class="messages" id="messages">
            <div class="typing-indicator" id="typingIndicator">Typing...</div>
        </div>
        <div class="input-area">
            <input type="hidden" id="thread" value="">
            <input type="text" id="chatInput" placeholder="Type a message..."
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.12/marked.min.js"></script>

    <script>
        async function runAssistantFlow(chat) {
            const API_KEY = '';
            const ASSISTANT_ID = '';
            const BASE_URL = "https://api.openai.com/v1";

            const headers = {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json",
                'OpenAI-Beta': 'assistants=v2'
            };

            const threadDiv = document.getElementById('thread');

            try {
                if (!threadDiv.value) {
                    // Step 1: Create a thread
                    const threadRes = await fetch(`${BASE_URL}/threads`, {
                        method: "POST",
                        headers,
                        body: JSON.stringify({}),
                    });
                    const thread = await threadRes.json();
                    console.log("Thread ID:", thread.id);
                    threadDiv.value = thread.id;
                }

                const threadId = threadDiv.value;

                if (threadId) {
                    // Step 2: Add a message to the thread
                    const messageRes = await fetch(`${BASE_URL}/threads/${threadId}/messages`, {
                        method: "POST",
                        headers,
                        body: JSON.stringify({
                            role: "user",
                            content: chat,
                        }),
                    });
                    const message = await messageRes.json();
                    console.log("Message ID:", message.id);

                    // Step 3: Create a run using the Assistant ID
                    const runRes = await fetch(`${BASE_URL}/threads/${threadId}/runs`, {
                        method: "POST",
                        headers,
                        body: JSON.stringify({
                            assistant_id: ASSISTANT_ID,
                        }),
                    });
                    const run = await runRes.json();
                    console.log("Run ID:", run.id);

                    // Step 4: Poll run status
                    let runStatus;
                    do {
                        await new Promise((res) => setTimeout(res, 2000));
                        const statusRes = await fetch(`${BASE_URL}/threads/${threadId}/runs/${run.id}`, {
                            method: "GET",
                            headers,
                        });
                        runStatus = await statusRes.json();
                        console.log("Run status:", runStatus.status);
                    } while (runStatus.status !== "completed");

                    // Step 5: Get assistant messages
                    const messagesRes = await fetch(`${BASE_URL}/threads/${threadId}/messages`, {
                        method: "GET",
                        headers,
                    });
                    const messages = await messagesRes.json();
                    const assistantMsg = messages.data.find((msg) => msg.role === "assistant");

                    return assistantMsg?.content[0]?.text?.value || "(No response)";
                } else {
                    console.error("Thread ID is not available.");
                    return "(No thread ID)";
                }
            } catch (err) {
                console.error("Error:", err);
                return "(Error occurred)";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('messages');
            const typingIndicator = document.getElementById('typingIndicator');
            const messageText = input.value.trim();

            if (messageText) {
                const message = document.createElement('div');
                message.textContent = messageText;
                message.classList.add('message', 'user');
                messages.appendChild(message);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;

                // Show typing indicator
                typingIndicator.style.display = 'block';

                const completion = await runAssistantFlow(messageText);

                const htmlContent = window.marked.parse(completion);

                // Simulate a response from another user
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const otherMessage = document.createElement('div');
                    otherMessage.innerHTML = htmlContent;
                    otherMessage.classList.add('message', 'other');
                    messages.appendChild(otherMessage);
                    messages.scrollTop = messages.scrollHeight;
                }, 1000);
            }
        }
    </script>
</body>

</html>
