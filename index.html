<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-box {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background-color: #007BFF;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message.other {
            background-color: #e9ecef;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            font-size: 14px;
            color: #6c757d;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: #f8f9fa;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: #007BFF;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="chat-box">
        <div class="messages" id="messages">
            <div class="typing-indicator" id="typingIndicator">Typing...</div>
        </div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Type a message..."
                onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.12/marked.min.js"></script>

    <script>
        const openaiApiKey = "";

        async function fetchOpenAIResponse(messageText) {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${openaiApiKey}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "user", content: messageText }],
                    store: true
                })
            });

            if (!response.ok) {
                throw new Error("Failed to fetch OpenAI response");
            }

            return await response.json();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const messages = document.getElementById('messages');
            const typingIndicator = document.getElementById('typingIndicator');
            const messageText = input.value.trim();

            if (messageText) {
                const message = document.createElement('div');
                message.textContent = messageText;
                message.classList.add('message', 'user');
                messages.appendChild(message);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;

                // Show typing indicator
                typingIndicator.style.display = 'block';

                const completion = await fetchOpenAIResponse(messageText)

                const htmlContent = window.marked.parse(completion.choices[0].message.content);

                // Simulate a response from another user
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const otherMessage = document.createElement('div');
                    otherMessage.innerHTML = htmlContent;
                    otherMessage.classList.add('message', 'other');
                    messages.appendChild(otherMessage);
                    messages.scrollTop = messages.scrollHeight;
                }, 1000);
            }
        }
    </script>
</body>

</html>
